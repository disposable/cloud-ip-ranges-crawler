name: Mutation Testing

# Mutation testing is too slow for the PR gate — run it weekly and on
# demand. `mutmut run` is incremental, so rerunning after adding tests
# only re-tests mutants in functions whose source changed.

permissions:
  contents: read

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

jobs:
  mutmut:
    name: mutmut (unit suite)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python environment
        run: uv sync

      - name: Restore mutmut cache
        uses: actions/cache@v6
        with:
          path: mutants/
          key: mutmut-${{ github.sha }}
          restore-keys: |
            mutmut-

      - name: Run mutmut
        run: uv run mutmut run

      - name: Report results
        if: always()
        run: uv run mutmut results | tee mutmut-results.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutmut-results
          path: mutmut-results.txt
