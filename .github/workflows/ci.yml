name: Code Checks

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  validate:
    name: Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache uv
        id: cache-primes
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-cache-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-cache-

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python environment
        run: uv sync

      - name: Build wheel
        run: uv build

      - name: Run Ruff (PEP 8 Formatting)
        run: uv run make format

      - name: Run Ruff (Linting)
        run: uv run make check

      - name: Run vulture (Dead Code)
        run: uv run make vulture

      - name: Run radon (Cyclomatic Complexity)
        run: uv run make complexity

      - name: Run xenon (Complexity Enforcement)
        run: uv run make xenon

      - name: Run bandit (Security)
        run: uv run make bandit

      - name: Run pyright (Type Checking)
        run: uv run make pyright

  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python environment
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run pytest (Unit Tests)
        run: |
          # --no-sync: the sync step above already built the venv for the
          # matrix python. A bare `uv run` would re-resolve against
          # .python-version, switching interpreter.
          uv run --no-sync pytest tests/unit -v --cov-fail-under=85

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  integration:
    name: Integration Tests (Live Sources)
    runs-on: ubuntu-latest
    needs: [validate, test]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Cache uv
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-cache-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            uv-cache-

      - name: Set up Python environment
        run: uv sync

      - name: Run Integration Tests
        env:
          INTEGRATION_TESTS: "true"
        run: uv run make test-integration
